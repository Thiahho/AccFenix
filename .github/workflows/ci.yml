name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Non-secret placeholders. No API runs in CI: the pages catch the failed fetches and the build still succeeds.
      API_URL: http://localhost:5080
      NEXT_PUBLIC_API_URL: http://localhost:5080
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BRAND_NAME: Eggy
      API_TRUSTED_KEY: ci-placeholder-trusted-web-key-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Build
        run: npx next build --turbopack

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # ApiFactory creates and drops a temporary database on this server instead of starting Testcontainers.
      ACCFENIX_TEST_DB: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      - name: Test
        run: dotnet test api/AccFenix.sln
